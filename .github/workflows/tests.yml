name: tests
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "benchx[parquet]" pytest -r requirements.txt
      - name: shell syntax check
        run: bash -n scripts/clone-lib.sh scripts/bench-run.sh
      - name: unit tests
        run: python -m pytest -q scripts/test_ci.py
